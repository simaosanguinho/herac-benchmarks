plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.0"
}

group 'com.dynamichtml'
version '1.0'

repositories {
    mavenCentral()
}

shadowJar() {
    configurations = [project.configurations.compileClasspath]
    from sourceSets.main.output
}

dependencies {
    implementation files(System.getenv('ARGO_HOME') + '/hydra-lib/build/libs/hydra-lib-1.0-all.jar')
    implementation 'com.fasterxml.jackson.jr:jackson-jr-objects:2.13.0-rc2'
    implementation 'com.github.spullara.mustache.java:compiler:0.9.10'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.dynamichtml.DynamicHTML',
                'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
        )
    }
}
