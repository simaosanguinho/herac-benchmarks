specVersion: 0.36.0
name: kn-classify
runtime: springboot
registry: knative-jv
created: 2025-05-09T16:17:54.766842115+01:00
build:
  builder: pack
  buildEnvs:
  - name: BP_NATIVE_IMAGE
    value: "true"
  - name: BP_JVM_VERSION
    value: "21"
  - name: BP_MAVEN_ACTIVE_PROFILES
    value: native
  - name: BP_NATIVE_IMAGE_BUILD_ARGUMENTS
    value: "-H:ConfigurationFileDirectories=/workspace/BOOT-INF/classes/native-image"
deploy:
  healthEndpoints:
    liveness: /actuator/health
    readiness: /actuator/health
