plugins {
    id 'java'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.reflection.Reflection'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

group 'com.reflection'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
}

test {
    useJUnitPlatform()
}
