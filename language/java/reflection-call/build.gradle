plugins {
    id 'java'
}

jar {
    manifest {
        attributes(
			'Main-Class': 'com.reflection.Reflection'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

group 'com.reflection'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.8'
}

test {
    useJUnitPlatform()
}
