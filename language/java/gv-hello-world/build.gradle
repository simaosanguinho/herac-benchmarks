plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.0"
}

group 'com.hello_world'
version '1.0'

repositories {
    mavenCentral()
}

shadowJar() {
    configurations = [project.configurations.compileClasspath]
    from sourceSets.main.output
}

dependencies {
    implementation files('../../../../argo/graalvisor-lib/build/libs/graalvisor-1.0-guest.jar')
}

processResources{
    from(zipTree('../../../../argo/graalvisor-lib/build/libs/graalvisor-1.0-guest.jar')){
        include("com.oracle.svm.graalvisor.headers/")
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.hello_world.HelloWorld',
                'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
        )
    }
}

test {
    useJUnitPlatform()
}
